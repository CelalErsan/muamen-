<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>MUÀ - Masa & Sipariş Takip</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #f5f5f5;
      --empty: #2c2c2c;
      --waiting: #ff9800;
      --served: #2196f3;
      --green: #4caf50;
      --danger: #f44336;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 80px; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; gap: 8px; }
    header h1 { font-size: 1.15rem; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .conn-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); display: inline-block; flex-shrink: 0; }
    .conn-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .legend { display: flex; gap: 10px; font-size: 0.75rem; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .logout-btn { background: none; border: 1px solid #444; color: #aaa; padding: 4px 8px; border-radius: 6px; font-size: 0.72rem; cursor: pointer; }

    /* Giriş ekranı */
    .login-card { max-width: 360px; margin: 80px auto 0; background: var(--card); padding: 24px; border-radius: 14px; }
    .login-card h2 { font-size: 1.1rem; text-align: center; margin-bottom: 16px; }
    .login-card input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #121212; color: #fff; font-size: 1rem; margin-bottom: 10px; }
    .login-card button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--green); color: #fff; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .login-err { color: var(--danger); font-size: 0.85rem; text-align: center; margin-top: 10px; min-height: 1em; }

    .zone-title { font-size: 0.95rem; color: #aaa; margin: 16px 0 8px; font-weight: 600; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }

    .table-btn {
      background: var(--empty);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 10px 4px;
      color: var(--text);
      text-align: center;
      cursor: pointer;
      position: relative;
      transition: 0.15s;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
    }
    .table-btn .t-name { font-size: 1.1rem; font-weight: 700; }
    .table-btn .t-info { font-size: 0.68rem; margin-top: 3px; opacity: 0.9; }
    .table-btn .t-price { font-size: 0.72rem; margin-top: 2px; color: #ffd54f; font-weight: 600; }

    .table-btn.status-waiting {
      background: rgba(255, 152, 0, 0.22);
      border-color: var(--waiting);
      animation: pulse 1.8s infinite;
    }
    .table-btn.status-served {
      background: rgba(33, 150, 243, 0.22);
      border-color: var(--served);
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(255, 152, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      justify-content: center;
      align-items: flex-end;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--card);
      width: 100%;
      max-width: 650px;
      height: 94vh;
      border-radius: 16px 16px 0 0;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 8px; }
    .modal-header h2 { font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
    .total-badge { background: #333; color: #ffd54f; font-size: 0.95rem; padding: 4px 10px; border-radius: 8px; }
    .total-badge:empty { display: none; }
    .close-btn { background: #333; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .order-list { list-style: none; margin-bottom: 10px; max-height: 200px; overflow-y: auto; flex-shrink: 0; }
    .order-empty { color: #777; text-align: center; padding: 12px 0; font-size: 0.9rem; }
    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #282828;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      border-left: 4px solid var(--waiting);
    }
    .order-item.served {
      border-left-color: var(--green);
      opacity: 0.6;
    }
    .order-item.served .item-name { text-decoration: line-through; color: #aaa; }
    .item-left { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; }
    .item-qty { background: #444; padding: 2px 7px; border-radius: 6px; font-weight: bold; font-size: 0.85rem; }
    .item-name { font-size: 0.95rem; font-weight: 500; }
    .item-price { font-size: 0.8rem; color: #ffd54f; margin-left: auto; margin-right: 8px; }
    .item-actions { display: flex; gap: 5px; }
    .btn-small { border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; color: #fff; }
    .btn-plus { background: #3b82f6; }
    .btn-del { background: var(--danger); }

    .search-and-custom { display: flex; gap: 6px; margin-bottom: 8px; flex-shrink: 0; }
    .search-and-custom input {
      flex: 1; padding: 9px 10px; border-radius: 8px; border: 1px solid #444; background: #121212; color: #fff; font-size: 0.9rem;
    }
    .search-and-custom button {
      background: var(--green); color: #fff; border: none; padding: 0 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; white-space: nowrap;
    }

    .quick-cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; flex-shrink: 0; }
    .cat-tab { background: #2c2c2c; color: #ccc; border: none; padding: 7px 12px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-size: 0.82rem; }
    .cat-tab.active { background: #fff; color: #000; font-weight: bold; }

    .quick-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
      gap: 7px;
      margin-bottom: 10px;
      overflow-y: auto;
      flex: 1;
      align-content: start;
    }
    .q-btn {
      background: #262626; color: #eee; border: 1px solid #383838; padding: 9px 6px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; text-align: center; user-select: none; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; min-height: 54px;
    }
    .q-btn .q-price { font-size: 0.72rem; color: #ffd54f; }
    .q-btn:active { background: var(--green); color: #fff; }
    .q-empty { color: #777; font-size: 0.85rem; grid-column: 1 / -1; text-align: center; padding: 12px 0; }

    .clear-table-btn {
      width: 100%; background: var(--danger); color: #fff; border: none; padding: 13px; border-radius: 10px; font-size: 0.95rem; font-weight: bold; cursor: pointer; flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- GİRİŞ -->
  <div id="loginSection" class="login-card" style="display:none;">
    <h2>MUÀ Sipariş Takip Girişi</h2>
    <input type="email" id="email" placeholder="E-posta" autocomplete="username">
    <input type="password" id="password" placeholder="Şifre" autocomplete="current-password">
    <button id="loginBtn">Giriş Yap</button>
    <p id="loginError" class="login-err"></p>
  </div>

  <!-- UYGULAMA -->
  <div id="appSection" style="display:none;">
    <header>
      <h1><span id="connDot" class="conn-dot"></span> MUÀ SİPARİŞ TAKİP</h1>
      <div class="header-right">
        <div class="legend">
          <span><i class="dot" style="background:var(--waiting)"></i> Bekliyor</span>
          <span><i class="dot" style="background:var(--served)"></i> Servis</span>
        </div>
        <button class="logout-btn" id="logoutBtn">Çıkış</button>
      </div>
    </header>

    <div id="zones-container"></div>
  </div>

  <!-- Masa Detay Modalı -->
  <div class="modal" id="tableModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>
          <span id="modalTableName">B1</span>
          <span id="modalTableTotal" class="total-badge"></span>
        </h2>
        <button class="close-btn" id="closeModalBtn">Kapat ✕</button>
      </div>

      <ul class="order-list" id="orderList"></ul>

      <div class="search-and-custom">
        <input type="text" id="searchInput" placeholder="🔍 Menüde ara veya özel not yaz..." />
        <button id="addCustomBtn">+ Özel Ekle</button>
      </div>

      <div class="quick-cats" id="catTabs"></div>
      <div class="quick-items" id="quickItems"></div>

      <button class="clear-table-btn" id="clearTableBtn">💰 ROBOTPOS'A GEÇİLDİ / MASAYI BOŞALT</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, child, push, onValue, runTransaction, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD-3Y4maIdQLL9bipnbbwVhg8wg462pg7k",
      authDomain: "mua-qr-menu.firebaseapp.com",
      databaseURL: "https://mua-qr-menu-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mua-qr-menu",
      storageBucket: "mua-qr-menu.firebasestorage.app",
      messagingSenderId: "813387212404",
      appId: "1:813387212404:web:e91c88891cabfb70de5321"
    };

    const ZONES = [
      { title: "Bahçe (B1 - B18)", prefix: "B", count: 18 },
      { title: "Kış Bahçesi (K1 - K14)", prefix: "K", count: 14 },
      { title: "İç Mekan (İ1 - İ4)", prefix: "İ", count: 4 },
      { title: "Üst Kat", prefix: "ÜST ", count: 1 }
    ];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const tablesRef = ref(db, 'mua_adisyon_masalar');

    let tablesData = {};
    let menu = {};            // { "Soğuk İçecekler": [{name, price}], ... }
    let activeTable = null;
    let activeCategory = "";
    let searchQuery = "";
    let unsubs = [];

    const $ = (id) => document.getElementById(id);

    // ---------- YARDIMCILAR ----------
    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    // "1.350" -> 1350, "1.350,50" -> 1350.5, "250" -> 250
    function parsePrice(raw) {
      const s = String(raw ?? '').replace(/[^0-9.,]/g, '').replace(/\./g, '').replace(',', '.');
      return Number(s) || 0;
    }

    function formatTL(n) {
      return n.toLocaleString('tr-TR', { maximumFractionDigits: 2 }) + ' ₺';
    }

    // Masa verisi eski sürümde dizi olarak kaydedilmiş olabilir; hepsini [key, item] listesine çevir
    function tableEntries(tName) {
      const t = tablesData[tName];
      if (!t) return [];
      return Object.entries(t)
        .filter(([, it]) => it && it.name)
        .sort((a, b) => (a[1].t || 0) - (b[1].t || 0));
    }

    function toObject(cur) {
      if (!cur) return {};
      if (Array.isArray(cur)) {
        const o = {};
        cur.forEach((v, i) => { if (v) o[i] = v; });
        return o;
      }
      return cur;
    }

    function hata(err) {
      console.error(err);
      alert("Kayıt yapılamadı: " + (err?.message || err));
    }

    // ---------- GİRİŞ ----------
    $('loginBtn').addEventListener('click', () => {
      $('loginError').textContent = '';
      signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value)
        .catch(() => { $('loginError').textContent = 'Giriş başarısız, e-posta veya şifreyi kontrol et.'; });
    });
    $('password').addEventListener('keypress', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
    $('logoutBtn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      unsubs.forEach(u => u());
      unsubs = [];
      if (user) {
        $('loginSection').style.display = 'none';
        $('appSection').style.display = 'block';
        dinlemeyiBaslat();
      } else {
        closeModal();
        tablesData = {};
        $('loginSection').style.display = 'block';
        $('appSection').style.display = 'none';
      }
    });

    // ---------- CANLI DİNLEME ----------
    function dinlemeyiBaslat() {
      unsubs.push(onValue(ref(db, '.info/connected'), (snap) => {
        $('connDot').classList.toggle('online', snap.val() === true);
      }));

      unsubs.push(onValue(tablesRef, (snap) => {
        tablesData = snap.val() || {};
        renderZones();
        if (activeTable) renderModalOrders();
      }, (err) => alert("Masalar okunamadı (yetki yok olabilir): " + err.message)));

      unsubs.push(onValue(ref(db, 'menuData'), (snap) => {
        const d = snap.val();
        if (!d || !d.items) return;
        const m = {};
        (d.categories || []).forEach(c => {
          if (c && c.id !== 'cat-en-cok-tercih-edilenler') m[c.title] = [];
        });
        const titles = Object.fromEntries((d.categories || []).filter(Boolean).map(c => [c.id, c.title]));
        Object.values(d.items).forEach(it => {
          if (!it || !it.name || it.active === false) return;
          const cat = titles[it.cat] || 'Diğer';
          (m[cat] ||= []).push({ name: it.name.trim(), price: parsePrice(it.price) });
        });
        Object.keys(m).forEach(k => { if (!m[k].length) delete m[k]; });
        menu = m;
        if (!menu[activeCategory]) activeCategory = Object.keys(menu)[0] || '';
        if (activeTable) renderQuickMenu();
      }));
    }

    // ---------- MASALAR ----------
    function renderZones() {
      const container = $('zones-container');
      container.innerHTML = '';

      ZONES.forEach(zone => {
        container.appendChild(el('div', 'zone-title', zone.title));
        const grid = el('div', 'grid');

        for (let i = 1; i <= zone.count; i++) {
          const tName = `${zone.prefix}${i}`;
          const items = tableEntries(tName).map(([, it]) => it);
          const totalQty = items.reduce((s, it) => s + (it.qty || 0), 0);
          const waitingQty = items.filter(x => !x.served).reduce((s, it) => s + (it.qty || 0), 0);
          const totalPrice = items.reduce((s, it) => s + (it.price || 0) * (it.qty || 0), 0);

          const btn = el('button', 'table-btn');
          if (items.length) btn.classList.add(waitingQty > 0 ? 'status-waiting' : 'status-served');
          btn.appendChild(el('span', 't-name', tName));
          btn.appendChild(el('span', 't-info',
            totalQty > 0 ? (waitingQty > 0 ? `⏳ ${waitingQty} Bekliyor` : `✓ ${totalQty} Ürün`) : 'Boş'));
          if (totalPrice > 0) btn.appendChild(el('span', 't-price', formatTL(totalPrice)));
          btn.onclick = () => openModal(tName);
          grid.appendChild(btn);
        }
        container.appendChild(grid);
      });
    }

    // ---------- MODAL ----------
    function openModal(tName) {
      activeTable = tName;
      searchQuery = '';
      $('searchInput').value = '';
      $('modalTableName').textContent = `Masa: ${tName}`;
      $('tableModal').classList.add('active');
      renderModalOrders();
      renderQuickMenu();
    }

    function closeModal() {
      activeTable = null;
      $('tableModal').classList.remove('active');
    }
    $('closeModalBtn').addEventListener('click', closeModal);

    function renderModalOrders() {
      const list = $('orderList');
      const entries = tableEntries(activeTable);
      list.innerHTML = '';

      const total = entries.reduce((s, [, it]) => s + (it.price || 0) * (it.qty || 0), 0);
      $('modalTableTotal').textContent = total > 0 ? formatTL(total) : '';

      if (!entries.length) {
        list.appendChild(el('li', 'order-empty', 'Bu masada henüz sipariş yok.'));
        return;
      }

      entries.forEach(([key, it]) => {
        const li = el('li', 'order-item' + (it.served ? ' served' : ''));

        const left = el('div', 'item-left');
        left.appendChild(el('span', 'item-qty', `${it.qty}x`));
        left.appendChild(el('span', 'item-name', it.name));
        const itemTotal = (it.price || 0) * (it.qty || 0);
        if (itemTotal > 0) left.appendChild(el('span', 'item-price', formatTL(itemTotal)));
        left.onclick = () => toggleServed(key);

        const actions = el('div', 'item-actions');
        const plus = el('button', 'btn-small btn-plus', '+1');
        plus.onclick = () => changeQty(key, 1);
        const del = el('button', 'btn-small btn-del', '🗑️');
        del.onclick = () => changeQty(key, -1);
        actions.append(plus, del);

        li.append(left, actions);
        list.appendChild(li);
      });
    }

    // ---------- YAZMA İŞLEMLERİ (her biri sadece kendi masasına / ürününe dokunur) ----------
    function addItem(name, price = 0) {
      name = (name || '').trim();
      if (!activeTable || !name) return;
      const tableRef = child(tablesRef, activeTable);
      const newKey = push(tableRef).key; // sadece anahtar üretir, yazmaz

      runTransaction(tableRef, (cur) => {
        const t = toObject(cur);
        const existingKey = Object.keys(t).find(k =>
          t[k] && !t[k].served && String(t[k].name).toLowerCase() === name.toLowerCase());
        if (existingKey) {
          t[existingKey].qty = (t[existingKey].qty || 0) + 1;
        } else {
          t[newKey] = { name, qty: 1, price, served: false, t: Date.now() };
        }
        return t;
      }).catch(hata);
    }

    function toggleServed(key) {
      runTransaction(child(tablesRef, `${activeTable}/${key}`), (cur) => {
        if (!cur) return null;
        cur.served = !cur.served;
        return cur;
      }).catch(hata);
    }

    function changeQty(key, delta) {
      runTransaction(child(tablesRef, `${activeTable}/${key}`), (cur) => {
        if (!cur) return null;
        const q = (cur.qty || 0) + delta;
        if (q <= 0) return null; // ürünü sil
        cur.qty = q;
        return cur;
      }).catch(hata);
    }

    $('clearTableBtn').addEventListener('click', () => {
      if (!activeTable) return;
      const t = activeTable;
      if (confirm(`${t} masasının hesabı RobotPOS'tan alındı mı? Masa sıfırlanacak.`)) {
        remove(child(tablesRef, t)).then(closeModal).catch(hata);
      }
    });

    // ---------- HIZLI MENÜ ----------
    $('searchInput').addEventListener('input', () => {
      searchQuery = $('searchInput').value.trim().toLocaleLowerCase('tr-TR');
      renderQuickMenu();
    });
    $('searchInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') $('addCustomBtn').click(); });
    $('addCustomBtn').addEventListener('click', () => {
      const v = $('searchInput').value.trim();
      if (!v) return;
      addItem(v, 0);
      $('searchInput').value = '';
      searchQuery = '';
      renderQuickMenu();
    });

    function renderQuickMenu() {
      const tabs = $('catTabs');
      const box = $('quickItems');
      tabs.innerHTML = '';
      box.innerHTML = '';

      const cats = Object.keys(menu);
      cats.forEach(cat => {
        const b = el('button', 'cat-tab' + (!searchQuery && cat === activeCategory ? ' active' : ''), cat);
        b.onclick = () => {
          activeCategory = cat;
          searchQuery = '';
          $('searchInput').value = '';
          renderQuickMenu();
        };
        tabs.appendChild(b);
      });

      let products = [];
      if (searchQuery) {
        cats.forEach(c => menu[c].forEach(p => {
          if (p.name.toLocaleLowerCase('tr-TR').includes(searchQuery)) products.push(p);
        }));
      } else if (menu[activeCategory]) {
        products = menu[activeCategory];
      }

      if (!cats.length) {
        box.appendChild(el('div', 'q-empty', 'Menü yükleniyor...'));
        return;
      }
      if (!products.length) {
        box.appendChild(el('div', 'q-empty', 'Ürün bulunamadı, "+ Özel Ekle" ile not olarak ekleyebilirsin.'));
        return;
      }

      products.forEach(p => {
        const b = el('button', 'q-btn');
        b.appendChild(el('span', '', p.name));
        if (p.price > 0) b.appendChild(el('span', 'q-price', formatTL(p.price)));
        b.onclick = () => addItem(p.name, p.price);
        box.appendChild(b);
      });
    }
  </script>
</body>
</html>
