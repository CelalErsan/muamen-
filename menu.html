<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Menü – MUÀ Gelatieri d'Italia</title>
    <meta name="description" content="MUÀ Gelatieri d'Italia Gaziantep menüsü: dondurmalar, kahveler, soğuk içecekler ve tatlılar.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23D80058%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Arial,sans-serif%27 font-size=%2734%27 fill=%27white%27 text-anchor=%27middle%27%3EM%3C/text%3E%3C/svg%3E">
    <meta name="theme-color" content="#FAFAFA">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Logo ve dükkândan: mermer beyazı, mürekkep, logodaki dudak fuşyası */
        :root {
            --mermer: #FAFAFA;
            --murekkep: #241B1F;
            --gri: #77706F;
            --damar: #E8E5E3;
            --fusya: #D80058;
            --fusya-acik: #FDE8F0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Jost', -apple-system, "Segoe UI", sans-serif;
            background: var(--mermer); color: var(--murekkep);
            -webkit-font-smoothing: antialiased;
            padding-bottom: env(safe-area-inset-bottom);
        }
        button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
        :focus-visible { outline: 2px solid var(--fusya); outline-offset: 2px; }

        /* ---------- Başlık ---------- */
        .ust { padding: 30px 20px 18px; display: flex; justify-content: center; }
        .ust a { display: block; }
        .ust img { display: block; width: 128px; height: auto; filter: brightness(0) saturate(100%) invert(9%) sepia(12%) saturate(1400%) hue-rotate(290deg); }

        /* ---------- Kategori şeridi ---------- */
        .kategoriler {
            position: sticky; top: 0; z-index: 50;
            background: rgba(250,250,250,0.94);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
        }
        .kategoriler.golgeli { box-shadow: 0 1px 0 var(--damar); }
        .kategoriler-ic { display: flex; gap: 4px; overflow-x: auto; padding: 10px 16px; scrollbar-width: none; max-width: 640px; margin: 0 auto; }
        .kategoriler-ic::-webkit-scrollbar { display: none; }
        .kat-btn {
            flex: 0 0 auto; white-space: nowrap; font-size: 0.95rem; font-weight: 400; color: var(--gri);
            padding: 7px 14px; border-radius: 999px; transition: background-color 0.25s ease, color 0.25s ease;
        }
        .kat-btn.aktif { background: var(--fusya); color: #fff; font-weight: 500; }

        /* ---------- Menü ---------- */
        .menu { max-width: 640px; margin: 0 auto; padding: 0 20px; }
        .bolum { scroll-margin-top: 58px; padding: 30px 0 6px; }
        .bolum h2 { font-size: 2.1rem; font-weight: 300; letter-spacing: -0.015em; line-height: 1.1; margin-bottom: 6px; }
        .alt-kategori { font-size: 0.98rem; font-weight: 500; color: var(--fusya); margin: 22px 0 2px; }

        .urun { display: grid; grid-template-columns: 1fr auto 34px; column-gap: 12px; align-items: start; padding: 13px 0; }
        .urun-metin { min-width: 0; }
        .urun-ad { font-size: 1.08rem; font-weight: 500; line-height: 1.3; }
        .aciklama { margin-top: 3px; font-size: 0.9rem; font-weight: 400; color: var(--gri); line-height: 1.45; max-width: 46ch; }
        .rozet-satir { grid-column: 1 / -1; margin-bottom: 5px; }
        .rozet { display: inline-block; font-size: 0.78rem; font-weight: 500; color: var(--fusya); background: var(--fusya-acik); padding: 1px 8px; border-radius: 999px; }
        .fiyat { font-size: 1.05rem; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; line-height: 1.3; }
        .foto-btn {
            width: 34px; height: 34px; border-radius: 50%; margin-top: -4px;
            display: inline-flex; align-items: center; justify-content: center;
            color: var(--fusya); background: var(--fusya-acik); transition: transform 0.15s ease;
        }
        .foto-btn:active { transform: scale(0.92); }
        .foto-btn svg { width: 17px; height: 17px; }

        /* Kendi kategorisinde öne çıkan ürün: adı fuşya */
        .urun.one-cikan .urun-ad { color: var(--fusya); }

        /* ---------- Fuşya blok: en çok tercih edilenler (dükkândaki pembe bardak duvarı gibi) ---------- */
        .bolum.populer {
            background: var(--fusya); color: #fff;
            margin: 14px -20px 10px; padding: 30px 20px 18px;
        }
        .bolum.populer h2 { color: #fff; }
        .bolum.populer .aciklama { color: rgba(255,255,255,0.78); }
        .bolum.populer .rozet { background: #fff; color: var(--fusya); }
        .bolum.populer .urun.one-cikan .urun-ad { color: #fff; }
        .bolum.populer .foto-btn { background: rgba(255,255,255,0.18); color: #fff; }
        @media (min-width: 680px) { .bolum.populer { border-radius: 22px; margin-left: 0; margin-right: 0; } }

        .durum { text-align: center; color: var(--gri); padding: 70px 20px; font-size: 1rem; }

        /* ---------- Alt bilgi ---------- */
        .alt { max-width: 640px; margin: 40px auto 0; padding: 28px 20px 44px; text-align: center; }
        .alt p { font-size: 0.86rem; color: var(--gri); margin: 3px 0; }
        .alt-linkler { display: flex; justify-content: center; gap: 22px; margin-top: 16px; }
        .alt-linkler a { font-size: 0.92rem; color: var(--murekkep); text-decoration: underline; text-decoration-color: var(--damar); text-decoration-thickness: 2px; text-underline-offset: 5px; }

        /* ---------- Fotoğraf penceresi ---------- */
        .foto-pencere {
            position: fixed; inset: 0; z-index: 1000; background: rgba(36,27,31,0.92);
            display: flex; justify-content: center; align-items: center; padding: 24px;
            visibility: hidden; opacity: 0; transition: opacity 0.25s ease, visibility 0s linear 0.25s;
        }
        .foto-pencere.acik { visibility: visible; opacity: 1; transition: opacity 0.25s ease; }
        .foto-kutu { position: relative; max-width: 520px; width: 100%; transform: scale(0.94); transition: transform 0.32s cubic-bezier(.2,0,0,1); }
        .foto-pencere.acik .foto-kutu { transform: none; }
        .foto-kutu img { display: block; width: 100%; max-height: 76vh; object-fit: contain; border-radius: 16px; opacity: 0; transition: opacity 0.25s ease; }
        .foto-kutu img.yuklendi { opacity: 1; }
        .foto-baslik { color: #fff; text-align: center; font-size: 1.1rem; font-weight: 400; margin-top: 12px; }
        .foto-kapat { position: absolute; top: -50px; right: 0; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.14); color: #fff; display: flex; align-items: center; justify-content: center; }
        .foto-kapat svg { width: 20px; height: 20px; }

        /* ---------- Garson çağır (sadece masadaki QR ile açılınca) ---------- */
        body.masali { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
        .cagir {
            position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
            z-index: 60; width: min(360px, calc(100% - 32px)); height: 58px; border-radius: 999px;
            display: none; align-items: center; justify-content: center; gap: 10px;
            background: var(--murekkep); color: #fff; font-size: 1.05rem; font-weight: 500;
            box-shadow: 0 10px 30px rgba(36,27,31,0.28); transition: background-color 0.3s ease, transform 0.15s ease;
        }
        body.masali .cagir { display: flex; }
        .cagir:active { transform: translateX(-50%) scale(0.98); }
        .cagir svg { width: 20px; height: 20px; flex-shrink: 0; }
        .cagir .masa-etiket { font-size: 0.82rem; font-weight: 400; opacity: 0.7; padding-left: 10px; margin-left: 2px; border-left: 1px solid rgba(255,255,255,0.3); }
        .cagir.gonderildi { background: var(--fusya); }
        .cagir:disabled { cursor: default; }

        /* ---------- Sayfa geçişi: logo ana sayfadan buraya kayar ---------- */
        @view-transition { navigation: auto; }
        .ust img { view-transition-name: mua-logo; }
        ::view-transition-old(root) { animation: 320ms cubic-bezier(.4,0,.2,1) both sayfaCik; }
        ::view-transition-new(root) { animation: 420ms cubic-bezier(.2,0,0,1) 60ms both sayfaGir; }
        ::view-transition-group(mua-logo) { animation-duration: 520ms; animation-timing-function: cubic-bezier(.2,0,0,1); }
        @keyframes sayfaCik { to { opacity: 0; transform: scale(0.97); } }
        @keyframes sayfaGir { from { opacity: 0; transform: translateY(14px); } }
        body.giris { animation: sayfaGir 0.42s cubic-bezier(.2,0,0,1) both; }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            body.giris { animation: none; }
            .foto-kutu, .foto-pencere, .kat-btn { transition: none; }
            ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
        }
    </style>
</head>
<body>
    <script>if (!('onpagereveal' in window)) document.body.classList.add('giris');</script>

    <header class="ust">
        <a href="index.html" aria-label="Ana sayfa"><img src="img/logo_white.png" alt="MUÀ Gelatieri d'Italia" width="500" height="171"></a>
    </header>

    <nav class="kategoriler" id="kategorilerNav" aria-label="Kategoriler">
        <div class="kategoriler-ic" id="kategoriler"></div>
    </nav>

    <main class="menu" id="menu">
        <p class="durum">Menü yükleniyor…</p>
    </main>

    <footer class="alt">
        <p>Tüm fiyatlarımıza KDV dahildir.</p>
        <p id="guncelleme"></p>
        <div class="alt-linkler">
            <a href="index.html">Ana sayfa</a>
            <a href="https://files.qrcodeg.com/pdfs/33f7a7c8-cb1e-422a-babe-a4f20c13a902.pdf" target="_blank" rel="noopener">Alerjen bilgileri</a>
        </div>
    </footer>

    <button class="cagir" id="cagirBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <span id="cagirYazi">Garson çağır</span>
        <span class="masa-etiket" id="cagirMasa"></span>
    </button>

    <div class="foto-pencere" id="fotoPencere" role="dialog" aria-modal="true" aria-label="Ürün fotoğrafı">
        <div class="foto-kutu">
            <button class="foto-kapat" id="fotoKapat" aria-label="Kapat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <img id="fotoResim" alt="">
            <div class="foto-baslik" id="fotoBaslik"></div>
        </div>
    </div>

    <script>
        var DB_URL = "https://mua-qr-menu-default-rtdb.europe-west1.firebasedatabase.app/menuData.json";
        var POPULER = "cat-en-cok-tercih-edilenler";
        var KAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

        function el(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined && text !== null) e.textContent = text;
            return e;
        }
        function liste(x) { return !x ? [] : (Array.isArray(x) ? x : Object.values(x)).filter(Boolean); }
        function fiyatYaz(p) { var s = String(p == null ? '' : p).trim(); return s ? s + ' ₺' : ''; }
        function gorselVar(item) { return item.image && String(item.image).trim() && item.image !== "RESİM_LİNKİ"; }

        function urunSatiri(item, populerde) {
            var oneCikan = populerde ? (item.popularFeatured !== undefined ? item.popularFeatured : item.featured) : item.featured;
            var rozet = populerde ? (item.popularBadge || item.badge) : item.badge;

            var d = el('div', 'urun' + (oneCikan ? ' one-cikan' : ''));
            var metin = el('div', 'urun-metin');
            if (rozet) {
                var rz = el('div', 'rozet-satir');
                rz.appendChild(el('span', 'rozet', String(rozet).replace(/^★\s*/, '')));
                d.appendChild(rz); // rozet kendi satırında, fiyat ürün adıyla aynı hizada kalsın
            }
            metin.appendChild(el('div', 'urun-ad', item.name || ''));
            if (item.desc) metin.appendChild(el('p', 'aciklama', item.desc));
            d.appendChild(metin);
            d.appendChild(el('div', 'fiyat', fiyatYaz(item.price)));

            if (gorselVar(item)) {
                var b = el('button', 'foto-btn');
                b.type = 'button';
                b.setAttribute('aria-label', (item.name || '') + ' fotoğrafı');
                b.innerHTML = KAMERA;
                b.addEventListener('click', function () { fotoAc(item.image, item.name); });
                d.appendChild(b);
            } else {
                d.appendChild(el('span'));
            }
            return d;
        }

        function ciz(data) {
            var menu = document.getElementById('menu');
            var nav = document.getElementById('kategoriler');
            if (!data || !data.items) {
                menu.innerHTML = '';
                menu.appendChild(el('p', 'durum', 'Menü şu an görüntülenemiyor. Kasadan yardım isteyebilirsiniz.'));
                return;
            }
            if (data.lastUpdated) document.getElementById('guncelleme').textContent = 'Fiyat güncelleme tarihi: ' + data.lastUpdated;

            menu.innerHTML = '';
            nav.innerHTML = '';
            var urunler = liste(data.items).filter(function (i) { return i.active !== false; });

            liste(data.categories).forEach(function (cat) {
                var populer = cat.id === POPULER;
                var catUrun = populer
                    ? urunler.filter(function (i) { return i.popular; }).sort(function (a, b) { return (a.popularOrder || 99) - (b.popularOrder || 99); })
                    : urunler.filter(function (i) { return i.cat === cat.id; });
                if (!catUrun.length) return;

                var btn = el('button', 'kat-btn', cat.title);
                btn.type = 'button';
                btn.dataset.hedef = cat.id;
                btn.addEventListener('click', function () {
                    var h = document.getElementById(cat.id);
                    if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                nav.appendChild(btn);

                var bolum = el('section', 'bolum' + (populer ? ' populer' : ''));
                bolum.id = cat.id;
                bolum.appendChild(el('h2', '', cat.title));
                var sonAlt = null;
                catUrun.forEach(function (item) {
                    if (!populer && item.subCat && item.subCat !== sonAlt) {
                        bolum.appendChild(el('div', 'alt-kategori', item.subCat));
                        sonAlt = item.subCat;
                    }
                    bolum.appendChild(urunSatiri(item, populer));
                });
                menu.appendChild(bolum);
            });

            kategoriTakibi();
        }

        function seritKaydir(b) {
            var kap = document.getElementById('kategoriler');
            var hedef = b.offsetLeft - kap.offsetLeft - (kap.clientWidth - b.offsetWidth) / 2;
            kap.scrollTo({ left: Math.max(0, hedef), behavior: 'smooth' });
        }

        // Kaydırırken o an görünen kategori üst şeritte işaretlenir
        function kategoriTakibi() {
            var butonlar = document.querySelectorAll('.kat-btn');
            if (butonlar.length) butonlar[0].classList.add('aktif');
            if (!('IntersectionObserver' in window)) return;
            var gozcu = new IntersectionObserver(function (girdiler) {
                girdiler.forEach(function (g) {
                    if (!g.isIntersecting) return;
                    butonlar.forEach(function (b) {
                        var aktif = b.dataset.hedef === g.target.id;
                        b.classList.toggle('aktif', aktif);
                        // Sadece şeridi yatay kaydır (scrollIntoView bazı iPhone'larda sayfayı da zıplatıyor)
                        if (aktif) seritKaydir(b);
                    });
                });
            }, { rootMargin: '-70px 0px -70% 0px', threshold: 0 });
            document.querySelectorAll('.bolum').forEach(function (s) { gozcu.observe(s); });
        }

        // Şerit sayfanın üstüne yapışınca altına ince bir çizgi gelir
        var navEl = document.getElementById('kategorilerNav');
        window.addEventListener('scroll', function () { navEl.classList.toggle('golgeli', navEl.getBoundingClientRect().top <= 0 && window.scrollY > 60); }, { passive: true });

        fetch(DB_URL + '?t=' + Date.now())
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(ciz)
            .catch(function () {
                var menu = document.getElementById('menu');
                menu.innerHTML = '';
                menu.appendChild(el('p', 'durum', 'Menü yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.'));
            });

        // ---------- Garson çağır ----------
        // Masadaki QR "menu.html?masa=B5" açar. Masa bilgisi oturum boyunca saklanır (ana sayfaya gidip dönse de kalır).
        var CAGRI_URL = "https://mua-qr-menu-default-rtdb.europe-west1.firebasedatabase.app/mua_cagrilar/";
        var BEKLEME_SN = 60;
        var masa = null;
        try {
            var q = new URLSearchParams(location.search).get('masa');
            if (q) sessionStorage.setItem('mua_masa', q);
            masa = q || sessionStorage.getItem('mua_masa');
        } catch (e) {}
        if (masa) masa = masa.trim().toLocaleUpperCase('tr-TR');
        if (masa && !/^[A-ZÇĞİÖŞÜ]{1,3}[0-9]{1,2}$/.test(masa)) masa = null;

        var cagirBtn = document.getElementById('cagirBtn');
        var cagirYazi = document.getElementById('cagirYazi');
        var sayac = null;

        function cagrildi(kalanSn) {
            cagirBtn.disabled = true;
            cagirBtn.classList.add('gonderildi');
            clearInterval(sayac);
            var bitis = Date.now() + kalanSn * 1000;
            cagirYazi.textContent = 'Garsonumuz geliyor';
            sayac = setInterval(function () {
                if (Date.now() >= bitis) {
                    clearInterval(sayac);
                    cagirBtn.disabled = false;
                    cagirBtn.classList.remove('gonderildi');
                    cagirYazi.textContent = 'Garson çağır';
                }
            }, 1000);
        }

        if (masa) {
            document.body.classList.add('masali');
            document.getElementById('cagirMasa').textContent = 'Masa ' + masa;
            // Bu telefondan az önce çağrıldıysa bekleme süresini sürdür
            try {
                var son = +sessionStorage.getItem('mua_cagri_' + masa) || 0;
                var gecen = (Date.now() - son) / 1000;
                if (gecen < BEKLEME_SN) cagrildi(BEKLEME_SN - gecen);
            } catch (e) {}

            cagirBtn.addEventListener('click', function () {
                if (cagirBtn.disabled) return;
                cagirBtn.disabled = true;
                cagirYazi.textContent = 'Gönderiliyor…';
                fetch(CAGRI_URL + encodeURIComponent(masa) + '.json', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ t: { '.sv': 'timestamp' } })
                }).then(function (r) {
                    // 401: bu masa son 1 dakikada zaten çağırmış; garson zaten haberdar
                    if (!r.ok && r.status !== 401) throw new Error('HTTP ' + r.status);
                    try { sessionStorage.setItem('mua_cagri_' + masa, String(Date.now())); } catch (e) {}
                    cagrildi(BEKLEME_SN);
                }).catch(function () {
                    cagirBtn.disabled = false;
                    cagirYazi.textContent = 'Gönderilemedi, tekrar deneyin';
                    setTimeout(function () { if (!cagirBtn.disabled) cagirYazi.textContent = 'Garson çağır'; }, 3000);
                });
            });
        }

        // ---------- Fotoğraf penceresi (telefonda geri tuşu kapatır) ----------
        var pencere = document.getElementById('fotoPencere');
        var resim = document.getElementById('fotoResim');
        var gecmisteAcik = false;
        function fotoAc(url, ad) {
            resim.classList.remove('yuklendi');
            resim.onload = function () { resim.classList.add('yuklendi'); };
            resim.src = url;
            resim.alt = ad || '';
            document.getElementById('fotoBaslik').textContent = ad || '';
            pencere.classList.add('acik');
            if (resim.complete) resim.classList.add('yuklendi');
            history.pushState({ foto: true }, '');
            gecmisteAcik = true;
        }
        function fotoKapat() {
            pencere.classList.remove('acik');
            if (gecmisteAcik) { gecmisteAcik = false; history.back(); }
        }
        document.getElementById('fotoKapat').addEventListener('click', fotoKapat);
        pencere.addEventListener('click', function (e) { if (e.target === pencere) fotoKapat(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && pencere.classList.contains('acik')) fotoKapat(); });
        window.addEventListener('popstate', function () { if (gecmisteAcik) { gecmisteAcik = false; pencere.classList.remove('acik'); } });
    </script>
</body>
</html>
