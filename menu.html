<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Menü · MUÀ Gelatieri d'Italia</title>
    <meta name="description" content="MUÀ Gelatieri d'Italia Gaziantep menüsü: dondurmalar, kahveler, soğuk içecekler ve tatlılar.">
    <meta name="theme-color" content="#f4f2ef">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --zemin: #f4f2ef;
            --kagit: #ffffff;
            --espresso: #2c1e16;
            --kahve: #8a7566;
            --cizgi: #e9e1da;
            --nokta: #cdbfb3;
            --mua: #d81b60;
            --mua-acik: #fcf0f4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Fraunces', Georgia, serif;
            background: var(--zemin);
            color: var(--espresso);
            -webkit-font-smoothing: antialiased;
            padding-bottom: env(safe-area-inset-bottom);
        }
        button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
        :focus-visible { outline: 2px solid var(--mua); outline-offset: 2px; }

        /* ---------- Başlık ---------- */
        .ust { text-align: center; padding: 34px 20px 22px; }
        .ust a { display: inline-block; }
        .ust img { width: 132px; height: auto; display: block; filter: brightness(0) saturate(100%) invert(12%) sepia(18%) saturate(1200%) hue-rotate(340deg) brightness(92%); }
        .ust p { margin-top: 10px; font-style: italic; font-size: 0.98rem; color: var(--kahve); }

        /* ---------- Kategori menüsü ---------- */
        .kategoriler {
            position: sticky; top: 0; z-index: 50;
            background: rgba(244,242,239,0.92);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--cizgi);
        }
        .kategoriler-ic {
            display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px;
            scrollbar-width: none; max-width: 640px; margin: 0 auto;
        }
        .kategoriler-ic::-webkit-scrollbar { display: none; }
        .kat-btn {
            flex: 0 0 auto; white-space: nowrap;
            font-size: 0.93rem; font-weight: 500; color: var(--kahve);
            padding: 7px 13px; border-radius: 20px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .kat-btn.aktif { background: var(--espresso); color: #fff; }

        /* ---------- Menü ---------- */
        .menu { max-width: 640px; margin: 0 auto; padding: 0 14px; }
        .bolum { scroll-margin-top: 64px; padding-top: 34px; }
        .bolum h2 {
            font-size: 1.75rem; font-weight: 500; font-style: italic; letter-spacing: -0.01em;
            margin: 0 6px 12px; color: var(--espresso);
        }
        .kagit {
            background: var(--kagit); border-radius: 18px;
            padding: 6px 18px;
            box-shadow: 0 1px 2px rgba(44,30,22,0.04), 0 6px 20px rgba(44,30,22,0.04);
        }
        .alt-kategori {
            font-style: italic; font-size: 0.95rem; font-weight: 500; color: var(--mua);
            padding: 16px 0 2px;
        }
        .alt-kategori:first-child { padding-top: 12px; }

        .urun { padding: 14px 0; border-bottom: 1px solid var(--cizgi); }
        .urun:last-child { border-bottom: none; }
        .satir { display: flex; align-items: baseline; gap: 8px; }
        .urun-ad { font-size: 1.06rem; font-weight: 600; line-height: 1.3; }
        /* Basılı menülerdeki gibi ad ile fiyat arasında noktalı çizgi */
        .nokta { flex: 1; min-width: 16px; border-bottom: 1.5px dotted var(--nokta); transform: translateY(-4px); }
        .fiyat { font-size: 1.04rem; font-weight: 600; white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
        .aciklama { margin-top: 4px; font-size: 0.87rem; font-style: italic; color: var(--kahve); line-height: 1.45; padding-right: 40px; }
        .rozet { display: inline-block; font-size: 0.78rem; font-weight: 600; font-style: italic; color: var(--mua); margin-bottom: 3px; }

        .urun.one-cikan { background: var(--mua-acik); margin: 6px -10px; padding: 14px 10px; border-radius: 12px; border-bottom: none; }
        .urun.one-cikan + .urun { border-top: none; }

        .foto-btn {
            display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
            font-size: 0.8rem; font-style: italic; color: var(--mua);
            padding: 4px 10px 4px 8px; border-radius: 14px; background: var(--mua-acik);
        }
        .one-cikan .foto-btn { background: #fff; }
        .foto-btn svg { width: 15px; height: 15px; }

        .durum { text-align: center; color: var(--kahve); font-style: italic; padding: 60px 20px; }

        /* ---------- Alt bilgi ---------- */
        .alt {
            max-width: 640px; margin: 48px auto 0; padding: 26px 20px 40px;
            text-align: center; border-top: 1px solid var(--cizgi);
        }
        .alt .marka { font-size: 1.3rem; font-style: italic; font-weight: 500; margin-bottom: 8px; }
        .alt p { font-size: 0.82rem; color: var(--kahve); margin: 3px 0; }
        .alt-linkler { display: flex; justify-content: center; gap: 18px; margin-top: 16px; }
        .alt-linkler a { font-size: 0.88rem; color: var(--espresso); text-decoration: underline; text-decoration-color: var(--nokta); text-underline-offset: 4px; }

        /* ---------- Fotoğraf penceresi ---------- */
        .foto-pencere {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(28,20,15,0.92);
            justify-content: center; align-items: center; padding: 24px;
        }
        .foto-kutu { position: relative; max-width: 520px; width: 100%; }
        .foto-kutu img { width: 100%; max-height: 78vh; object-fit: contain; border-radius: 14px; opacity: 0; transition: opacity 0.25s ease; display: block; }
        .foto-kutu img.yuklendi { opacity: 1; }
        .foto-baslik { color: #fff; text-align: center; font-style: italic; font-size: 1.05rem; margin-top: 12px; }
        .foto-kapat {
            position: absolute; top: -48px; right: 0; width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255,255,255,0.12); color: #fff; display: flex; align-items: center; justify-content: center;
        }
        .foto-kapat svg { width: 20px; height: 20px; }

        /* ---------- Hareket ---------- */
        @view-transition { navigation: auto; }
        .ust img { view-transition-name: mua-logo; }
        ::view-transition-old(root) { animation: 320ms cubic-bezier(.4,0,.2,1) both sayfaCik; }
        ::view-transition-new(root) { animation: 420ms cubic-bezier(.2,0,0,1) 60ms both sayfaGir; }
        ::view-transition-group(mua-logo) { animation-duration: 520ms; animation-timing-function: cubic-bezier(.2,0,0,1); }
        @keyframes sayfaCik { to { opacity: 0; transform: scale(0.97); } }
        @keyframes sayfaGir { from { opacity: 0; transform: translateY(14px); } }

        /* Geçişi desteklemeyen tarayıcılarda sayfa açılırken solarak gelir */
        body.giris { animation: sayfaGir 0.42s cubic-bezier(.2,0,0,1) both; }

        /* Menü verisi gelince içerik tek seferde yukarı süzülerek belirir */
        .menu.hazir .bolum { animation: belir 0.55s cubic-bezier(.2,0,0,1) both; }
        .menu.hazir .bolum:nth-child(2) { animation-delay: 0.06s; }
        .menu.hazir .bolum:nth-child(n+3) { animation-delay: 0.12s; }
        .kategoriler-ic.hazir { animation: belir 0.45s cubic-bezier(.2,0,0,1) both; }
        @keyframes belir { from { opacity: 0; transform: translateY(16px); } }

        /* Fotoğraf penceresi büyüyerek açılır, küçülerek kapanır */
        .foto-pencere { display: flex; visibility: hidden; opacity: 0; transition: opacity 0.25s ease, visibility 0s linear 0.25s; }
        .foto-pencere.acik { visibility: visible; opacity: 1; transition: opacity 0.25s ease; }
        .foto-kutu { transform: scale(0.92) translateY(10px); transition: transform 0.32s cubic-bezier(.2,0,0,1); }
        .foto-pencere.acik .foto-kutu { transform: none; }

        .kat-btn { transition: background-color 0.25s ease, color 0.25s ease; }
        .foto-btn { transition: transform 0.15s ease; }
        .foto-btn:active { transform: scale(0.96); }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            body.giris, .menu.hazir .bolum, .kategoriler-ic.hazir { animation: none; }
            .foto-kutu, .foto-pencere { transition: none; }
            ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
        }
    </style>
</head>
<body>
    <script>if (!('onpagereveal' in window)) document.body.classList.add('giris');</script>

    <header class="ust">
        <a href="index.html" aria-label="Ana sayfa"><img src="img/logo_white.png" alt="MUÀ Gelatieri d'Italia" width="500" height="171"></a>
        <p>Menü</p>
    </header>

    <nav class="kategoriler" aria-label="Kategoriler">
        <div class="kategoriler-ic" id="kategoriler"></div>
    </nav>

    <main class="menu" id="menu">
        <p class="durum" id="durum">Menü yükleniyor…</p>
    </main>

    <footer class="alt">
        <div class="marka">MUÀ</div>
        <p>Tüm fiyatlarımıza KDV dahildir.</p>
        <p id="guncelleme"></p>
        <div class="alt-linkler">
            <a href="index.html">Ana sayfa</a>
            <a href="https://files.qrcodeg.com/pdfs/33f7a7c8-cb1e-422a-babe-a4f20c13a902.pdf" target="_blank" rel="noopener">Alerjen bilgileri</a>
        </div>
    </footer>

    <div class="foto-pencere" id="fotoPencere" role="dialog" aria-modal="true" aria-label="Ürün fotoğrafı">
        <div class="foto-kutu">
            <button class="foto-kapat" id="fotoKapat" aria-label="Kapat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            <img id="fotoResim" alt="">
            <div class="foto-baslik" id="fotoBaslik"></div>
        </div>
    </div>

    <script>
        var DB_URL = "https://mua-qr-menu-default-rtdb.europe-west1.firebasedatabase.app/menuData.json";
        var POPULER = "cat-en-cok-tercih-edilenler";
        var KAMERA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

        function el(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text !== undefined && text !== null) e.textContent = text;
            return e;
        }
        function liste(x) { return !x ? [] : (Array.isArray(x) ? x : Object.values(x)).filter(Boolean); }
        function fiyatYaz(p) { var s = String(p == null ? '' : p).trim(); return s ? s + ' ₺' : ''; }
        function gorselVar(item) { return item.image && String(item.image).trim() && item.image !== "RESİM_LİNKİ"; }

        function urunSatiri(item, populerde) {
            var oneCikan = populerde ? (item.popularFeatured !== undefined ? item.popularFeatured : item.featured) : item.featured;
            var rozet = populerde ? (item.popularBadge || item.badge) : item.badge;

            var d = el('div', 'urun' + (oneCikan ? ' one-cikan' : ''));
            if (rozet) d.appendChild(el('span', 'rozet', rozet));

            var satir = el('div', 'satir');
            satir.appendChild(el('span', 'urun-ad', item.name || ''));
            satir.appendChild(el('span', 'nokta'));
            satir.appendChild(el('span', 'fiyat', fiyatYaz(item.price)));
            d.appendChild(satir);

            if (item.desc) d.appendChild(el('p', 'aciklama', item.desc));

            if (gorselVar(item)) {
                var b = el('button', 'foto-btn');
                b.type = 'button';
                b.innerHTML = KAMERA;
                b.appendChild(document.createTextNode('Fotoğrafı gör'));
                b.addEventListener('click', function () { fotoAc(item.image, item.name); });
                d.appendChild(b);
            }
            return d;
        }

        function ciz(data) {
            var menu = document.getElementById('menu');
            var nav = document.getElementById('kategoriler');
            if (!data || !data.items) {
                menu.innerHTML = '';
                menu.appendChild(el('p', 'durum', 'Menü şu an görüntülenemiyor. Lütfen kasadan yardım isteyin.'));
                return;
            }
            if (data.lastUpdated) document.getElementById('guncelleme').textContent = 'Fiyat güncelleme tarihi: ' + data.lastUpdated;

            menu.innerHTML = '';
            nav.innerHTML = '';
            var urunler = liste(data.items).filter(function (i) { return i.active !== false; });

            liste(data.categories).forEach(function (cat) {
                var catUrun = cat.id === POPULER
                    ? urunler.filter(function (i) { return i.popular; }).sort(function (a, b) { return (a.popularOrder || 99) - (b.popularOrder || 99); })
                    : urunler.filter(function (i) { return i.cat === cat.id; });
                if (!catUrun.length) return;

                var btn = el('button', 'kat-btn', cat.title);
                btn.type = 'button';
                btn.dataset.hedef = cat.id;
                btn.addEventListener('click', function () {
                    var h = document.getElementById(cat.id);
                    if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
                nav.appendChild(btn);

                var bolum = el('section', 'bolum');
                bolum.id = cat.id;
                bolum.appendChild(el('h2', '', cat.title));
                var kagit = el('div', 'kagit');
                var sonAlt = null;
                catUrun.forEach(function (item) {
                    if (cat.id !== POPULER && item.subCat && item.subCat !== sonAlt) {
                        kagit.appendChild(el('div', 'alt-kategori', item.subCat));
                        sonAlt = item.subCat;
                    }
                    kagit.appendChild(urunSatiri(item, cat.id === POPULER));
                });
                bolum.appendChild(kagit);
                menu.appendChild(bolum);
            });

            menu.classList.add('hazir');
            nav.classList.add('hazir');
            kategoriTakibi();
        }

        // Sayfa kaydırıldıkça üstteki kategori menüsünde o an görünen kategori işaretlenir
        function kategoriTakibi() {
            var butonlar = document.querySelectorAll('.kat-btn');
            if (butonlar.length) butonlar[0].classList.add('aktif');
            if (!('IntersectionObserver' in window)) return;
            var gozcu = new IntersectionObserver(function (girdiler) {
                girdiler.forEach(function (g) {
                    if (!g.isIntersecting) return;
                    butonlar.forEach(function (b) {
                        var aktif = b.dataset.hedef === g.target.id;
                        b.classList.toggle('aktif', aktif);
                        if (aktif) b.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    });
                });
            }, { rootMargin: '-80px 0px -70% 0px', threshold: 0 });
            document.querySelectorAll('.bolum').forEach(function (s) { gozcu.observe(s); });
        }

        fetch(DB_URL + '?t=' + Date.now())
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(ciz)
            .catch(function () {
                var menu = document.getElementById('menu');
                menu.innerHTML = '';
                menu.appendChild(el('p', 'durum', 'Menü yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.'));
            });

        // ---------- Fotoğraf penceresi (telefonda geri tuşu pencereyi kapatır) ----------
        var pencere = document.getElementById('fotoPencere');
        var resim = document.getElementById('fotoResim');
        var gecmisteAcik = false;

        function fotoAc(url, ad) {
            resim.classList.remove('yuklendi');
            resim.onload = function () { resim.classList.add('yuklendi'); };
            resim.src = url;
            resim.alt = ad || '';
            document.getElementById('fotoBaslik').textContent = ad || '';
            pencere.classList.add('acik');
            if (resim.complete) resim.classList.add('yuklendi');
            history.pushState({ foto: true }, '');
            gecmisteAcik = true;
        }
        function fotoKapat() {
            pencere.classList.remove('acik');
            if (gecmisteAcik) { gecmisteAcik = false; history.back(); }
        }
        document.getElementById('fotoKapat').addEventListener('click', fotoKapat);
        pencere.addEventListener('click', function (e) { if (e.target === pencere) fotoKapat(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && pencere.classList.contains('acik')) fotoKapat(); });
        window.addEventListener('popstate', function () {
            if (gecmisteAcik) { gecmisteAcik = false; pencere.classList.remove('acik'); }
        });
    </script>
</body>
</html>
