            background: #fcf0f4; border-radius: 50%; fill: #d81b60;
            transition: background-color 0.25s ease, fill 0.25s ease;

        .eye-icon.gorsel-yok { visibility: hidden; }
        .eye-icon:hover { background: #d81b60; fill: white; }

                });
                navScroll.appendChild(btn);

                const h2 = document.createElement("h2");
                h2.id = cat.id;
                h2.textContent = cat.title;
                menuContainer.appendChild(h2);

                let sonAltKategori = null;
                let ilkAltKategoriMi = true;

                catUrunleri.forEach(item => {
                    if (cat.id !== "cat-en-cok-tercih-edilenler" && item.subCat && item.subCat !== sonAltKategori) {
                        const subDiv = document.createElement("div");
                        subDiv.className = "sub-category-label" + (ilkAltKategoriMi ? " sub-category-label--first" : "");
                        subDiv.textContent = item.subCat;
                        menuContainer.appendChild(subDiv);
                        sonAltKategori = item.subCat;
                        ilkAltKategoriMi = false;
                    }
                    menuContainer.insertAdjacentHTML("beforeend", urunKartiOlustur(item, cat.id === "cat-en-cok-tercih-edilenler"));
                });
            });

            etkilesimleriBagla();
            menuGorselleriniOnYukle();
        });

        const modal = document.getElementById("imageModal");
        const modalImg = document.getElementById("modalImage");
        let modalGecmisteAcik = false;

        function modaliAc(url) {
            if (!url) return;
            modalImg.classList.remove("yuklendi");
            modal.style.display = "flex";
            modalImg.onload = () => modalImg.classList.add("yuklendi");
            modalImg.src = url;
            if (modalImg.complete) modalImg.classList.add("yuklendi");
            history.pushState({ modal: true }, "");
            modalGecmisteAcik = true;
        }

        function modaliKapat(geriGitmeliMi) {
            modal.style.display = "none";
            if (geriGitmeliMi && modalGecmisteAcik) {
                modalGecmisteAcik = false;
                history.back();
            }
        }

        document.querySelector(".close-btn").addEventListener("click", () => modaliKapat(true));
        modal.addEventListener("click", (e) => { if (e.target === modal) modaliKapat(true); });
        window.addEventListener("popstate", () => {
            if (modalGecmisteAcik) { modalGecmisteAcik = false; modal.style.display = "none"; }
        });

        function menuGorselleriniOnYukle() {
            const urlSeti = new Set();
            document.querySelectorAll(".eye-icon:not(.gorsel-yok)").forEach(icon => {
                const url = (icon.getAttribute("data-image") || "").trim();
                if (url) urlSeti.add(url);
            });
            const urlListesi = Array.from(urlSeti);
            let sira = 0;
            function sirdakiniYukle() {
                if (sira >= urlListesi.length) return;
                const gizliResim = new Image();
                gizliResim.onload = gizliResim.onerror = () => {
                    sira++;
                    setTimeout(sirdakiniYukle, 60);
                };
                gizliResim.src = urlListesi[sira];
            }
            sirdakiniYukle();
        }

        function etkilesimleriBagla() {
            document.querySelectorAll(".eye-icon:not(.gorsel-yok)").forEach(icon => {
                icon.addEventListener("click", function() { modaliAc(this.getAttribute("data-image")); });
            });

            const navButtons = document.querySelectorAll(".category-nav-btn");
            const sectionHeaders = document.querySelectorAll(".menu-container h2[id]");

            if (navButtons.length) navButtons[0].classList.add("active");

            if ("IntersectionObserver" in window) {
                const spyObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            navButtons.forEach(btn => {
                                const isActive = btn.getAttribute("data-target") === "#" + entry.target.id;
                                btn.classList.toggle("active", isActive);
                                if (isActive) btn.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
                            });
                        }
                    });
                }, { rootMargin: "-90px 0px -75% 0px", threshold: 0 });

                sectionHeaders.forEach(header => spyObserver.observe(header));
            }
        }
    </script>
</body>
</html>
