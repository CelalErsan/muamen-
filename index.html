<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUÀ Gelatieri d'Italia - Hoşgeldiniz</title>
    <style>
        @font-face {
            font-family: 'SmithCorona';
            src: url('smith.otf') format('opentype');
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'SmithCorona', monospace;
            background-color: #1c140f;
            overflow: hidden;
            position: relative;
        }

        /* Arka planda dönecek fotoğrafların ana kutusu */
        .slayt-arkaplan {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            background-color: #1c140f;
        }

        /* Fotoğrafların ortak özellikleri - artık gerçek <img> etiketi */
        .slayt {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slayt.aktif {
            opacity: 1;
        }

        /* Fotoğrafların üstüne binen karanlık filtre (butonlar parlasın diye) */
        .karartma {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            z-index: 1;
        }

        /* Ekranın ortasındaki logo ve buton bölümü */
        .icerik {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            z-index: 2;
        }

        .logo {
            width: 170px;
            margin-bottom: 20px;
            filter: brightness(0) invert(1);
        }

        .baslik {
            color: #ffffff;
            font-size: 18px;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 85%;
            max-width: 300px;
        }

        .btn-menu {
            text-decoration: none;
            color: #ffffff;
            background-color: #d81b60;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            border: 2px solid #d81b60;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.5);
        }

        .btn-menu:active {
            background-color: transparent;
            color: #d81b60;
            transform: scale(0.95);
        }

        .btn-alerjen {
            text-decoration: none;
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .btn-alerjen:active {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Arka plan animasyonu: gerçek <img> etiketleri kullanılıyor -->
    <div class="slayt-arkaplan" id="slaytKutusu">
        <img class="slayt" src="img/kapak1.jpg" alt="">
        <img class="slayt" src="img/kapak2.jpg" alt="">
        <img class="slayt" src="img/kapak3.jpg" alt="">
    </div>

    <div class="karartma"></div>

    <!-- Ortadaki Yazılar ve Butonlar -->
    <div class="icerik">
        <img src="https://mua.com.tr/wp-content/uploads/2017/12/logo.png" alt="MUA Logo" class="logo">
        <div class="baslik">İtalyan Dondurması & Kahve</div>

        <div class="button-container">
            <a href="menu.html" class="btn-menu">Menüyü İncele</a>
            <a href="https://files.qrcodeg.com/pdfs/33f7a7c8-cb1e-422a-babe-a4f20c13a902.pdf" class="btn-alerjen" target="_blank">Alerjen Bilgileri</a>
        </div>
    </div>

    <script>
        const slaytlar = document.querySelectorAll('.slayt');
        let index = 0;

        // Her resmin gerçekten yüklenip yüklenmediğini konsola yazar
        slaytlar.forEach(function (img) {
            img.addEventListener('error', function () {
                console.error('❌ Resim bulunamadı: ' + img.getAttribute('src'));
            });
            img.addEventListener('load', function () {
                console.log('✅ Resim yüklendi: ' + img.getAttribute('src'));
            });
        });

        function slaytDegistir() {
            slaytlar.forEach(function (img) {
                img.classList.remove('aktif');
            });
            slaytlar[index].classList.add('aktif');
            index = (index + 1) % slaytlar.length;
        }

        if (slaytlar.length > 0) {
            slaytDegistir(); // ilk resmi hemen göster
            setInterval(slaytDegistir, 5000); // her 5 saniyede bir değiştir
        }
    </script>

</body>
</html>
