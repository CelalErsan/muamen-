<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUÀ Gelatieri d'Italia</title>
    
    <style>
        /* FONTU SİSTEME TANITIYORUZ */
        @font-face {
            font-family: 'SmithCorona';
            src: url('smith.otf') format('opentype');
        }

        body {
            font-family: 'SmithCorona', monospace;
            background-color: #ffffff; 
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative; 
            z-index: 1;
        }
        
        /* MUA Logolu Hayalet Katman */
        body::before {
            content: "";
            position: fixed; 
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://mua.com.tr/wp-content/uploads/2017/12/logo.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: 50%; 
            opacity: 0.08; 
            z-index: -1; 
        }

        /* Ana Logo */
        .brand-logo {
            width: 180px;
            margin-bottom: 50px;
        }
        
        /* Butonların olduğu kutu */
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 85%;
            max-width: 350px;
        }
        
        /* Yönlendirme Butonları */
        .nav-btn {
            display: block;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: 600;
            color: #d81b60; /* MUA Pembesi */
            text-decoration: none;
            border: 2px solid #d81b60;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.2s;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
            background-color: #d81b60;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Üstteki Net Görünür Logo -->
    <img src="https://mua.com.tr/wp-content/uploads/2017/12/logo.png" alt="MUA Logo" class="brand-logo">

    <div class="button-container">
        <!-- Menüye Giden Buton -->
        <a href="menu.html" class="nav-btn">Menü</a>
        
        <!-- Alerjen Bilgilerine Giden Buton -->
        <a href="https://files.qrcodeg.com/pdfs/33f7a7c8-cb1e-422a-babe-a4f20c13a902.pdf" class="nav-btn">Alerjen Bilgileri</a>
    </div>

</body>
</html>
