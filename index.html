<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MUÀ Gelatieri d'Italia · Gaziantep</title>
    <meta name="description" content="MUÀ Gelatieri d'Italia Gaziantep: İtalyan dondurması ve kahve. Menümüzü inceleyin.">
    <meta name="theme-color" content="#1c140f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --mua: #D80058;
            --espresso: #1c140f;
            --krem: #f6efe9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { min-height: 100%; }
        body {
            font-family: 'Jost', -apple-system, "Segoe UI", sans-serif;
            background: var(--espresso);
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        /* Arka planda dükkândan fotoğraflar, yavaşça geçiş yapar */
        .slaytlar { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--espresso); }
        .slayt {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0; transform: scale(1.04);
            transition: opacity 1.6s ease, transform 7s ease-out;
        }
        .slayt.aktif { opacity: 1; transform: scale(1); }
        /* Fotoğraf üstte görünür kalsın, yazıların olduğu alt kısım koyulaşsın */
        .perde {
            position: fixed; inset: 0; z-index: 1;
            background:
                linear-gradient(180deg, rgba(28,20,15,0.35) 0%, rgba(28,20,15,0.15) 30%, rgba(28,20,15,0.78) 62%, rgba(28,20,15,0.96) 100%);
        }

        .sahne {
            position: relative; z-index: 2;
            min-height: 100vh; min-height: 100svh;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            text-align: center;
            padding: 48px 24px calc(28px + env(safe-area-inset-bottom));
        }
        .logo { width: 150px; height: auto; margin-bottom: 14px; }
        .alt-baslik {
            font-weight: 300; font-size: 1.2rem; line-height: 1.4; letter-spacing: 0.01em;
            color: var(--krem); opacity: 0.9; margin-bottom: 34px;
        }

        .butonlar { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 10px; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            height: 54px; border-radius: 14px; text-decoration: none;
            font-family: inherit; font-size: 1.02rem; font-weight: 400; letter-spacing: 0.01em;
            transition: transform 0.15s ease, background-color 0.2s ease;
        }
        .btn svg { width: 19px; height: 19px; flex-shrink: 0; }
        .btn:active { transform: scale(0.98); }
        .btn-ana { background: var(--mua); color: #fff; font-weight: 500; font-size: 1.1rem; height: 58px; box-shadow: 0 10px 30px rgba(216,0,88,0.35); }
        .btn-ikincil { background: rgba(255,255,255,0.09); color: #fff; border: 1px solid rgba(255,255,255,0.22); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
        .btn-ikincil:active { background: rgba(255,255,255,0.18); }
        .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

        .alt-not { margin-top: 26px; font-size: 0.82rem; font-weight: 300; color: var(--krem); opacity: 0.6; }

        /* ---------- Sayfa geçişi ---------- */
        /* Destekleyen tarayıcılarda sayfalar arası yumuşak geçiş; logo bir sayfadan diğerine kayar */
        @view-transition { navigation: auto; }
        .logo { view-transition-name: mua-logo; }
        ::view-transition-old(root) { animation: 320ms cubic-bezier(.4,0,.2,1) both sayfaCik; }
        ::view-transition-new(root) { animation: 420ms cubic-bezier(.2,0,0,1) 60ms both sayfaGir; }
        ::view-transition-group(mua-logo) { animation-duration: 520ms; animation-timing-function: cubic-bezier(.2,0,0,1); }
        @keyframes sayfaCik { to { opacity: 0; transform: scale(0.97); } }
        @keyframes sayfaGir { from { opacity: 0; transform: translateY(14px); } }

        /* Desteklemeyen tarayıcılar için: basınca sahne solarak çıkar */
        .sahne, .perde { transition: opacity 0.28s ease, transform 0.28s ease; }
        body.cikiyor .sahne { opacity: 0; transform: translateY(-8px); }
        body.cikiyor .perde { opacity: 1; }

        /* Açılışta içerik bir kez yumuşakça belirir */
        .logo, .alt-baslik, .butonlar, .alt-not { animation: belir 0.7s cubic-bezier(.2,0,0,1) both; }
        .alt-baslik { animation-delay: 0.08s; }
        .butonlar { animation-delay: 0.16s; }
        .alt-not { animation-delay: 0.24s; }
        @keyframes belir { from { opacity: 0; transform: translateY(12px); } }

        @media (prefers-reduced-motion: reduce) {
            .slayt { transition: opacity 0.4s ease; transform: none; }
            .slayt.aktif { transform: none; }
            .logo, .alt-baslik, .butonlar, .alt-not { animation: none; }
            ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
        }
        @media (min-height: 760px) {
            .logo { width: 170px; }
        }
    </style>
</head>
<body>

    <div class="slaytlar" aria-hidden="true">
        <img class="slayt aktif" src="img/kapak1.jpg" alt="" fetchpriority="high">
        <img class="slayt" src="img/kapak2.jpg" alt="" loading="lazy">
        <img class="slayt" src="img/kapak3.jpg" alt="" loading="lazy">
    </div>
    <div class="perde"></div>

    <main class="sahne">
        <img src="img/logo_white.png" alt="MUÀ Gelatieri d'Italia" class="logo" width="500" height="171">
        <p class="alt-baslik">İtalyan dondurması ve kahve</p>

        <nav class="butonlar" aria-label="Bağlantılar">
            <a href="menu.html" class="btn btn-ana">Menüyü incele</a>
            <a href="https://files.qrcodeg.com/pdfs/33f7a7c8-cb1e-422a-babe-a4f20c13a902.pdf" class="btn btn-ikincil" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
                Alerjen bilgileri
            </a>
            <a href="https://maps.app.goo.gl/4FReX32oHHrcBzXw6?g_st=ipc" class="btn btn-ikincil" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
                Bizi Google'da değerlendirin
            </a>
        </nav>

        <p class="alt-not">Gaziantep</p>
    </main>

    <script>
        // Sayfalar arası geçişi desteklemeyen tarayıcılarda: menü linkine basınca önce solarak çık, sonra git
        var gecisDestegi = 'onpageswap' in window;
        var hareketAz = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!gecisDestegi && !hareketAz) {
            document.querySelectorAll('a[href="menu.html"]').forEach(function (a) {
                a.addEventListener('click', function (e) {
                    if (e.metaKey || e.ctrlKey) return;
                    e.preventDefault();
                    document.body.classList.add('cikiyor');
                    setTimeout(function () { location.href = a.href; }, 260);
                });
            });
        }
        // Geri tuşuyla bu sayfaya dönülünce solmuş halde kalmasın
        window.addEventListener('pageshow', function () { document.body.classList.remove('cikiyor'); });

        // Fotoğraflar 5 saniyede bir yumuşakça değişir
        var slaytlar = document.querySelectorAll('.slayt');
        var sira = 0;
        if (slaytlar.length > 1) {
            setInterval(function () {
                slaytlar[sira].classList.remove('aktif');
                sira = (sira + 1) % slaytlar.length;
                slaytlar[sira].classList.add('aktif');
            }, 5000);
        }
    </script>
</body>
</html>
