<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUÀ Gelatieri d'Italia - Hoşgeldiniz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html {
            height: 100%; margin: 0; font-family: 'Fraunces', serif;
            background-color: #1c140f; overflow: hidden; position: relative;
        }
        .slayt-arkaplan {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; overflow: hidden; background-color: #1c140f;
        }
        .slayt {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0; transition: opacity 1.5s ease-in-out;
        }
        .slayt.aktif { opacity: 1; }
        .karartma {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.65); z-index: 1;
        }
        .icerik {
            position: relative; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
            padding: 0 20px; z-index: 2;
        }
        .logo { width: 170px; margin-bottom: 20px; }
        .baslik {
            color: #ffffff; font-size: 18px; margin-bottom: 30px; 
            letter-spacing: 2px; text-transform: uppercase;
        }
        .kampanya-kutusu {
            position: relative; border: 1px solid #d81b60; border-radius: 12px;
            padding: 22px 24px 16px 24px; margin-bottom: 35px; background-color: transparent;
        }
        .kutu-rozet {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            background-color: #d81b60; color: #ffffff; font-family: sans-serif;
            font-size: 11px; font-weight: 900; padding: 4px 16px; border-radius: 20px;
            text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .kampanya-saat {
            display: block; color: #f4c9d8; font-size: 13px; margin-bottom: 8px;
            letter-spacing: 1.5px; text-transform: uppercase; font-weight: bold;
        }
        .kampanya-metin {
            display: block; color: #ffffff; font-size: 17px;
            line-height: 1.5; letter-spacing: 0.5px;
        }
        .kampanya-vurgu { color: #d81b60; font-weight: bold; font-size: 19px; }
        .button-container {
            display: flex; flex-direction: column; gap: 15px;
            width: 85%; max-width: 300px;
        }
        .btn-menu {
            text-decoration: none; color: #ffffff; background-color: #d81b60;
            padding: 16px 20px; font-size: 18px; font-weight: bold;
            border-radius: 30px; border: 2px solid #d81b60;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(216, 27, 96, 0.5);
        }
        .btn-menu:active {
            background-color: transparent; color: #d81b60; transform: scale(0.95);
        }
        .btn-alerjen, .btn-google {
            text-decoration: none; color: #ffffff; background-color: rgba(255, 255, 255, 0.1);
            padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.5); transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .btn-alerjen:active, .btn-google:active {
            background-color: rgba(255, 255, 255, 0.3); transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="slayt-arkaplan" id="slaytKutusu">
        <img class="slayt" src="img/kapak1.jpg" alt="">
        <img class="slayt" src="img/kapak2.jpg" alt="">
        <img class="slayt" src="img/kapak3.jpg" alt="">
    </div>

    <div class="karartma"></div>

    <div class="icerik">
        <img src="img/logo_white.png" alt="MUA Logo" class="logo">
        <div class="baslik">İtalyan Dondurması & Kahve</div>

        <!-- KAMPANYA KUTUSU -->
        <div class="kampanya-kutusu" id="kampanyaKutusu">
            <div class="kutu-rozet" id="kampanyaRozet">🎁 Fırsat</div>
            <span class="kampanya-saat" id="kampanyaSaat">🕒Hafta İçi 10:00 - 18:00 Arası</span>
            <span class="kampanya-metin" id="kampanyaMetin">
                <span class="kampanya-vurgu">2 Top</span> Dondurma Alana<br>
                Limonata veya Kahve İkram!
            </span>
        </div>

        <div class="button-container">
            <a href="menu.html" class="btn-menu">Menüyü İncele</a>
            <a href="https://files.qrcodeg.com/pdfs/33f7a7c8-cb1e-422a-babe-a4f20c13a902.pdf" class="btn-alerjen" target="_blank">Alerjen Bilgileri</a>
            <a href="https://maps.app.goo.gl/4FReX32oHHrcBzXw6?g_st=ipc" class="btn-google" target="_blank">⭐ Bizi Değerlendirin</a>
        </div>
    </div>

    <script>
        const slaytlar = document.querySelectorAll('.slayt');
        let index = 0;

        function slaytDegistir() {
            slaytlar.forEach(img => img.classList.remove('aktif'));
            slaytlar[index].classList.add('aktif');
            index = (index + 1) % slaytlar.length;
        }

        if (slaytlar.length > 0) {
            slaytDegistir(); 
            setInterval(slaytDegistir, 5000); 
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD-3Y4maIdQLL9bipnbbwVhg8wg462pg7k",
            authDomain: "mua-qr-menu.firebaseapp.com",
            databaseURL: "https://mua-qr-menu-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mua-qr-menu",
            storageBucket: "mua-qr-menu.firebasestorage.app",
            messagingSenderId: "813387212404",
            appId: "1:813387212404:web:e91c88891cabfb70de5321"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'menuData/campaign'), (snapshot) => {
            const camp = snapshot.val();
            if (!camp) return;
            const kutu = document.getElementById("kampanyaKutusu");
            if (camp.active === false) {
                kutu.style.display = "none";
            } else {
                kutu.style.display = "block";
                if (camp.hours) document.getElementById("kampanyaSaat").textContent = camp.hours;
                if (camp.text) document.getElementById("kampanyaMetin").innerHTML = camp.text;
            }
        });
    </script>
</body>
</html>
